name: Continiuous Integration Frontend (node.js)
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Execute cache step
        type: boolean
        default: true
      node-version:
        description: Node version
        type: choice
        options:
          - 24.x
          - 22.x
          - 20.x
        default: 24.x

env:
  build-artifact-key: frontend-${{ github.sha }}

jobs:
  code-validation:
    name: Code validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: ${{ inputs.node-version }}
      # - name: Download cached node.js dependencies
      #   uses: actions/cache@v6
      #   if: ${{ inputs.use-cache }}
      #   id: nodejs-dependencies
      #   with:
      #     path: frontend/node_modules
      #     key: nodejs-dependencies-${{ hashFiles('frontend/package-lock.json') }}
      # - name: Install node.js dependencies
      #   if: steps.nodejs-dependencies.outputs.cache-hit != 'true'
      #   run: npm ci
      - name: Setup and install node.js dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          node-version: 24.x
          working-dir: ./frontend
          target-environment: dev
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download cached node.js dependencies
        uses: actions/cache@v6
        if: ${{ inputs.use-cache }}
        id: nodejs-dependencies
        with:
          path: frontend/node_modules
          key: nodejs-dependencies-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install node.js dependencies
        if: steps.nodejs-dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build frontend code
        run: npm run build
      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.build-artifact-key }}
          path: frontend/build