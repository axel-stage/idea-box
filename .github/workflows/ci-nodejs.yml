name: Continiuous Integration NodeJS

on:
  workflow_dispatch:

jobs:
  code-checks:
    name: Code check
    runs-on: ubuntu latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check
