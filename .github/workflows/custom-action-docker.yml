name: Custom Actions - Docker

on:
  workflow_dispatch:
    inputs:
      url:
        type: string
        default: "https://www.google.com"
      max_trials:
        type: string
        default: "10"
        required: False
      delay:
        type: string
        default: "3"
        required: False

jobs:
  ping-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker ping URL
        id: ping-url
        uses: ./.github/actions/docker-ping-url/
        with:
          url: ${{ inputs.url }}
          max_trails: ${{ inputs.max_trials }}
          delay: ${{ inputs.delay }}
      - name: Print output from ping url
        run: |
          echo "URL reachable: ${{ steps.ping-url.outputs.url-reachable }}"
