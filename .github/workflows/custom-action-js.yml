name: Custom Actions - js
run-name: Custom Actions - js | BB - ${{ inputs.base-branch }} TB - ${{ inputs.target-branch }} WD - ${{ inputs.working-directory }}

on:
  workflow_dispatch:
    inputs:
      base-branch:
        type: string
        default: main
      head-branch:
        type: string
        default: update-dependencies
      working-directory:
        type: string
        default: frontend
      debug:
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-update:
    name: node.js dependency update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for depencies update
        uses: ./.github/actions/js-dependency-update/
        with:
          base-branch: ${{ inputs.base-branch }}
          head-branch: ${{ inputs.head-branch }}
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          debug: ${{ inputs.debug }}
