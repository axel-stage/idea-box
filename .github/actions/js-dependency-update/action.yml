name: Update npm dependencies
description: Checks if there are updates to the npm packages and creates a PR with updated packege*.json files.

inputs:
  base-branch:
    description: Branch for the dependency update checks
    default: main
    required: false
  target-branch:
    description: Branch form which the PR is created
    default: update-dependencies
    required: false
  working-directory:
    description: Working directory of the project
    required: true
  github-token:
    description: Auth token with repo access (write access to content and PR)
    required: true
  debug:
    description: Output debug message
    default: false

runs:
  using: node24
  main: dist/index.js
