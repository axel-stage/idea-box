name: Ping URL
description: Ping URL until maximum trails have reached.

inputs:
  url:
    description: Unified Resource Locator to ping
    required: true
  max_tries:
    description: Maximum number of trails until the action fails.
    default: '10'
    required: false
  delay:
    description: Delay in seconds between trails.
    default: '5'
    required: false

outputs:
  url-reachable:
    description: Whether URL is reachable

runs:
  using: docker
  image: Dockerfile