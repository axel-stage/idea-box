name: idea-box

networks:
  idea-box-net:
    driver: bridge

volumes:
  database-vol:
    driver: local

secrets:
  dbadmin_secret:
    file: ${PWD}/database/secret/dbadmin
  postgres_secret:
    file: ${PWD}/database/secret/postgres

services:
  # ubuntu-dev:
  #   platform: linux/amd64
  #   image: ubuntu:24.04
  #   container_name: ubuntu-dev
  #   restart: unless-stopped
  #   stdin_open: true
  #   tty: true
  database:
    platform: linux/amd64
    build:
      context: ${PWD}/database
      dockerfile: Dockerfile.postgres
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    image: dataengineer24/postgres-pgtap:${POSTGRES_VERSION}
    container_name: database
    restart: unless-stopped
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    env_file:
      - path: database/.env
    secrets:
      - postgres_secret
      - dbadmin_secret
    volumes:
      - database-vol:/var/lib/postgresql/data
      - ./database/init/schemas:/tmp/schemas
      - ./database/init/custom-postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database/init/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    platform: linux/amd64
    build:
      context: ${PWD}/backend
      dockerfile: Dockerfile.python
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: dataengineer24/backend:0.1
    container_name: backend
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    # stdin_open: true
    # tty: true
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python src/main.py


  frontend:
    platform: linux/amd64
    build:
      context: ${PWD}/frontend
      dockerfile: Dockerfile.nodejs
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - NODE_VERSION=${NODE_VERSION}
        - GID=${FRONTEND_GID}
        - GROUPNAME=${FRONTEND_GROUPNAME}
        - UID=${FRONTEND_UID}
        - USERNAME=${FRONTEND_USERNAME}
        - PORT=${FRONTEND_PORT}
    image: dataengineer24/frontend:0.1
    container_name: frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        fnm exec --using=${NODE_VERSION} npm run start
