name: idea-box

networks:
  idea-box-net:
    driver: bridge

volumes:
  database-vol:
    driver: local

secrets:
  dbadmin_secret:
    file: ${PWD}/database/secret/dbadmin
  postgres_secret:
    file: ${PWD}/database/secret/postgres

services:
  ubuntu:
    platform: linux/amd64
    image: ubuntu:24.04
    container_name: ubuntu
    restart: unless-stopped
    stdin_open: true
    tty: true
  database:
    platform: linux/amd64
    build:
      context: ${PWD}/database
      dockerfile: Dockerfile
    image: dataengineer24/postgres-pgtap:16.3
    container_name: database
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file:
      - path: database/.env
    secrets:
      - postgres_secret
      - dbadmin_secret
    volumes:
      - database-vol:/var/lib/postgresql/data
      - ./database/init/schemas:/tmp/schemas
      - ./database/init/custom-postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database/init/scripts:/docker-entrypoint-initdb.d
    networks:
      - idea-box-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    platform: linux/amd64
    build:
      context: ${PWD}/frontend
      dockerfile: Dockerfile
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - NODE_VERSION=${NODE_VERSION}
    image: dataengineer24/frontend:0.1
    container_name: frontend
    restart: unless-stopped
    ports:
      - 3000:3000
    command: ["npm", "run", "start"]
